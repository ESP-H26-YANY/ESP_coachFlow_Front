name: Deploy Frontend React

on:
  push:
    branches:
      - main  # ou 'master' selon ta branche

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name:  Récupérer le code
        uses: actions/checkout@v4

      - name:  Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm ci

      - name:  Créer le fichier .env de production
        run: echo "VITE_API_URL=${{ secrets.API_URL }}" > .env

      - name:  Compiler le projet (Build)
        run: npm run build

      - name:  Envoyer le build sur le serveur (sans git pull)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/"
          target: "/var/www/ESP_coachFlow_Front"
          overwrite: true

      - name:  Redémarrer PM2 proprement
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            pm2 restart coachflow-frontend
            pm2 save
